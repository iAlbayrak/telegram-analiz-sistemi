name: Scout v2 backtest (manual)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days of 1h history'
        default: '120'
        required: true
      top:
        description: 'Top symbols by volume'
        default: '150'
        required: true
      min_volume:
        description: 'Minimum 24h quote volume in USDT'
        default: '1500000'
        required: true
      grid:
        description: 'Run parameter robustness grid (slower)'
        type: boolean
        default: true
      btc_filter:
        description: 'Enable BTC regime filter'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scout-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Cache market data
        uses: actions/cache@v4
        with:
          path: data_cache
          key: scout-data-${{ github.run_id }}
          restore-keys: scout-data-

      - name: Run backtest
        run: >
          python -m scout.backtest
          --days ${{ inputs.days }}
          --top ${{ inputs.top }}
          --min-volume ${{ inputs.min_volume }}
          ${{ inputs.grid && '--grid' || '' }}
          ${{ inputs.btc_filter && '--btc-filter' || '' }}

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: scout-backtest
          path: reports/

      - name: Commit report for mobile viewing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scout: publish backtest report"
          for i in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not persist report after 3 attempts." >&2
          exit 1
