name: Scout v2 live scan

on:
  schedule:
    # Closed 1h candle; start a few minutes after the hour.
    - cron: '4 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scout-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests before live scan
        run: python -m unittest discover -s tests -t .

      - name: Scan closed 1h candles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scout.live

      - name: Persist Scout state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No Scout state changes."
            exit 0
          fi
          git commit -m "scout: persist live tracking state"
          for i in 1 2 3; do
            if git pull --rebase origin "${{ github.ref_name }}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not persist Scout state after 3 attempts." >&2
          exit 1
