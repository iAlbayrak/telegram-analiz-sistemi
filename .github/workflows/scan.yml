name: Altcoin Alert Scanner

on:
  schedule:
    # 7/24, her 15 dakikada bir; 15m mum kapanışından yaklaşık 2 dk sonra.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Aynı scanner'ın state dosyaları için iki çalışmanın birbirine girmesini önler.
# State kaydı ayrıca merge_and_push_state.py ile çakışmaya dayanıklı yapılmıştır.
concurrency:
  group: altcoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: V13.2 taramasını çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Analiz kapsamı: 100k+ vadeli hacim. Tüm aktif sözleşmeler ticker
          # aşamasında keşfedilir; derin analiz paralel çalışır. Spot keşif ayrıca
          # 500k+ spot ve 100k+ eşleşen vadeli hacim ile çalışır.
          MIN_ALERT_24H_VOLUME: '100000'
          MIN_SPOT_24H_VOLUME: '500000'
          MIN_SPOT_DISCOVERY_PERP_VOLUME: '100000'
          SPOT_RADAR_MAX_CANDIDATES: '0'
          DEEP_SCAN_MAX: '0'
          SCAN_WORKERS: '4'
          SLEEP_BETWEEN_COINS: '0.0'
          ALERT_MIN_SCORE: '80'
          MIN_CONFIRMED_RR: '1.8'
          MIN_DIRECTION_GAP: '5'
          MIN_SETUP_READINESS: '65'
        run: python altcoin_alert_scanner.py

      - name: Durumu ve sonuç takibini güvenli kaydet
        run: python merge_and_push_state.py
