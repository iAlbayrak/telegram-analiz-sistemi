name: Altcoin Alert Scanner

on:
  schedule:
    # 7/24, her 15 dakikada bir
    # Mum kapanışından yaklaşık 2 dakika sonra çalışır.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: altcoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_TITLE: 'iAlbayrak Analiz'
          MIN_24H_VOLUME: '1000000'
          ALERT_MIN_SCORE: '80'
        run: python altcoin_alert_scanner.py

      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain alert_state.json scan_diagnostic.log)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add alert_state.json scan_diagnostic.log
            git commit -m "alert state + tanı logu güncellendi"

            # Workflow çalışırken main dalına yeni bir commit geldiyse
            # önce onu alıp kendi commitimizi üzerine uygula.
            git fetch origin main
            git rebase origin/main

            git push origin HEAD:main
          else
            echo "Durumda değişiklik yok, commit atılmadı."
          fi
