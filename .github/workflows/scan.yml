name: Altcoin Alert Scanner

on:
  schedule:
    # 7/24, her 15 dakikada bir (mum kapanışından 2 dk sonra, veri
    # borsada oturması için). Gece kısıtlaması yok.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: {}   # İstediğiniz an "Run workflow" ile elle de tetikleyebilirsiniz

permissions:
  contents: write   # durum/log dosyalarını repoya geri yazabilmek için

# Bir tarama 15 dakikadan uzun sürerse bir sonraki tetiklenme aynı anda
# değil, öncekinin bitmesini bekleyip SIRAYLA çalışır -- alert_state.json
# ve scan_diagnostic.log'a çakışan/eşzamanlı yazım olmaz.
concurrency:
  group: altcoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Telegram ID kontrol
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getUpdates",
              params={"limit": 20},
              timeout=20
          )

          print("Telegram getUpdates HTTP:", r.status_code)
          data = r.json()

          if not data.get("ok"):
              print(data)
              raise SystemExit(1)

          updates = data.get("result", [])
          print("Bulunan update sayısı:", len(updates))

          for u in updates:
              chat = None

              if "channel_post" in u:
                  chat = u["channel_post"].get("chat")
              elif "message" in u:
                  chat = u["message"].get("chat")

              if chat:
                  print(
                      "CHAT BULUNDU:",
                      "id=", chat.get("id"),
                      "type=", chat.get("type"),
                      "title=", chat.get("title")
                  )
          PY
      - name: Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          r = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": "🧪 Telegram bağlantı testi başarılı."
              },
              timeout=20
          )

          print("Telegram HTTP:", r.status_code)
          print(r.text)
          r.raise_for_status()
          PY
      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_24H_VOLUME: '1000000'
          ALERT_MIN_SCORE: '80'
        run: python altcoin_alert_scanner.py

      # Bildirim geçmişini ve tanı logunu repoya geri yazar. Hem durumu
      # kalıcı/şeffaf tutar hem de her çalışma bir commit/push ürettiği
      # için GitHub'ın "60 gün hareketsiz repoda zamanlanmış görevleri
      # otomatik durdurma" kuralına hiç takılmamamızı sağlar.
      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain alert_state.json scan_diagnostic.log)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alert_state.json scan_diagnostic.log
            git commit -m "alert state + tanı logu güncellendi"
            git push
          else
            echo "Durumda değişiklik yok, commit atılmadı."
          fi
