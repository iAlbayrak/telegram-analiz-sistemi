name: Altcoin Alert Scanner

on:
  schedule:
    # 7/24, her 15 dakikada bir; mum kapanışından yaklaşık 2 dk sonra (V9)
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: altcoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Tarayıcıyı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_ALERT_24H_VOLUME: '250000'
          MIN_SPOT_24H_VOLUME: '500000'
          SPOT_RADAR_MAX_CANDIDATES: '12'
          DEEP_SCAN_MAX: '0' # 0 = tüm likit vadeli çiftleri analiz et
          ALERT_MIN_SCORE: '80'
          MIN_CONFIRMED_RR: '1.8'
          MIN_DIRECTION_GAP: '5'
          EARLY_TRIGGER_MAX_ATR: '0.85'
          MIN_SETUP_READINESS: '65'
          MARKET_CAP_REFRESH_MINUTES: '360'
        run: python altcoin_alert_scanner.py

      - name: Durum, tanı kaydı ve market-cap önbelleğini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Kaydedilecek durum değişikliği yok."
            exit 0
          fi
          git commit -m "V9 scanner state, diagnostics and market cap cache"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
