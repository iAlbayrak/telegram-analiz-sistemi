name: Altcoin Alert Scanner

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: altcoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Tarayıcıyı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_24H_VOLUME: '1000000'
          MIN_SPOT_24H_VOLUME: '500000'
          SPOT_RADAR_MAX_CANDIDATES: '50'
          SPOT_WATCH_COOLDOWN_HOURS: '6'
          ALERT_MIN_SCORE: '80'
          MIN_CONFIRMED_RR: '1.8'
          MIN_DIRECTION_GAP: '8'
          MIN_ENTRY_QUALITY: '55'
        run: python altcoin_alert_scanner.py

      - name: Durum, tanı kaydı ve market-cap önbelleğini kaydet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Kaydedilecek durum değişikliği yok."
            exit 0
          fi
          git commit -m "scanner state, diagnostics and market cap cache"
          # Başka bir commit tarama sırasında main'e geldiyse önce onu alıp
          # bu taramanın durum commit'ini yeniden uygula; eski fetch/push hatasını azaltır.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
