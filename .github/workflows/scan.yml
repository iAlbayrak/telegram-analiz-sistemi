name: Altcoin Alert Scanner

on:
  schedule:
    # 7/24, her 15 dakikada bir (mum kapanışından 2 dk sonra, veri
    # borsada oturması için). Gece kısıtlaması yok.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: altcoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt
      - name: Telegram Chat ID teşhis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" > /dev/null
          python - <<'PY'
          import os, json, urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"
          data = json.load(urllib.request.urlopen(url, timeout=20))

          print("Telegram API ok:", data.get("ok"))

          found = False
          for u in data.get("result", []):
              for key in ("channel_post", "message", "edited_channel_post", "edited_message"):
                  obj = u.get(key)
                  if obj and obj.get("chat"):
                      chat = obj["chat"]
                      print("CHAT ID:", chat.get("id"))
                      print("CHAT TITLE:", chat.get("title") or chat.get("username") or chat.get("first_name"))
                      print("CHAT TYPE:", chat.get("type"))
                      found = True

          if not found:
              print("Chat bulunamadı. Telegram kanalına TEST mesajı gönderip workflow'u tekrar çalıştır.")
          PY
      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_TITLE: 'iAlbayrak Analiz'
          MIN_24H_VOLUME: '1000000'
          ALERT_MIN_SCORE: '80'
        run: python altcoin_alert_scanner.py

      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain alert_state.json scan_diagnostic.log)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alert_state.json scan_diagnostic.log
            git commit -m "alert state + tanı logu güncellendi"
            git push
          else
            echo "Durumda değişiklik yok, commit atılmadı."
          fi
